[package]
name = "workstudio"
version = "0.1.0"
description = "AI WorkStudio — one workspace for brain, OpenCue, Lumina and the apps that come next"
authors = ["Lautaro Silva"]
license-file = "../../../LICENSE"
repository = "https://github.com/Lautaro005/workstudio"
edition = "2021"

[lib]
name = "workstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "workstudio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
dirs = "6"
toml_edit = "0.22"
anyhow = "1"
which = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
